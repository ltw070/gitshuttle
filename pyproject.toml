[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitshuttle"
version = "0.1.0"
description = "Air-gapped Git history synchronizer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.9",
    "textual>=0.47",
]

[project.scripts]
gitshuttle = "gitshuttle.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["gitshuttle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
tmp_path_retention_policy = "none"
addopts = "--basetemp=C:/CRA/01_GitShuttle/.pytest_tmp"
